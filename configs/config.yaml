# ERP System Configuration

server:
  host: 0.0.0.0
  port: 8080
  timeout: 30s
  mode: release

database:
  host: localhost
  port: 5432
  user: erp_user
  password: erp_password
  dbname: erp_system
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: erp-system-jwt-secret-key-zhouhouping-copyright-2026
  access_token_expire: 2h
  refresh_token_expire: 7d

llm:
  provider: qwen
  api_key: ""
  model: qwen-turbo
  rate_limit: 100
  timeout: 30s

log:
  level: info
  format: json
  output: stdout

cors:
  allow_origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8081
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type

device:
  websocket_port: 8081
  heartbeat_timeout: 60s

openapi:
  token_expire: 2h
  default_scopes:
    - read
    - write

app:
  name: ERP System
  version: 1.0.0
  copyright: zhouhouping
  copyright_year: 2026
