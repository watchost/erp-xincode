services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_system
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password_zhouhouping_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/0002_openapi_device.up.sql:/docker-entrypoint-initdb.d/002_openapi.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: redis-server --requirepass redis_password_zhouhouping_2026
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_zhouhouping_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  erp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=erp_user
      - DB_PASSWORD=erp_password_zhouhouping_2026
      - DB_NAME=erp_system
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password_zhouhouping_2026
      - REDIS_DB=0
      - JWT_SECRET=erp-system-jwt-secret-key-zhouhouping-copyright-2026
      - JWT_ACCESS_EXPIRE=2h
      - JWT_REFRESH_EXPIRE=168h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  erp-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: erp-web
    ports:
      - "8091:80"
    depends_on:
      - erp-server
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: